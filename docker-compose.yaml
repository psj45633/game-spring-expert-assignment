services:
  mysql:
    image: mysql:8.0
    container_name: game-expert-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: game_expert
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: game-expert-redis
    ports:
      - "6379:6379"

  app-a:
    build: .
    container_name: game-expert-app-a
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/game_expert
      DB_USERNAME: root
      DB_PASSWORD: 1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  app-b:
    build: .
    container_name: game-expert-app-b
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/game_expert
      DB_USERNAME: root
      DB_PASSWORD: 1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started